openapi: "3.1.0"
info:
  title: "BikeTheftTracker"
  description: "BikeTheftTracker API"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  /theft-reports:
    get:
      tags:
        - TheftReports
      summary: "GET /theft-reports"
      operationId: "getTheftReportMapItems"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/TheftReportMapItemResponse"
    post:
      tags:
        - TheftReports
      summary: "POST /theft-reports"
      operationId: "createTheftReport"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTheftReportRequest"
        required: true
      responses:
        "201":
          description: "CREATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheftReportResponse"
  /theft-reports/{id}:
    get:
      tags:
        - TheftReports
      summary: "GET /theft-reports/{id}"
      operationId: "getTheftReport"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "TheftReport id"
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheftReportResponse"
        "404":
          description: "NOT FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    GeoPoint:
      type: "object"
      properties:
        longitude:
          type: "number"
          format: "double"
          example: 42.431
          minimum: -180.0
          maximum: 180
        latitude:
          type: "number"
          format: "double"
          example: 53.135
          minimum: -90.0
          maximum: 90
    TheftReportMapItemResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        brand:
          type: "string"
          example: "Helkama"
        model:
          type: "string"
          example: "XS29.3"
        type:
          type: "string"
          example: "maastopyörä"
        color:
          type: "string"
          example: "sininen"
        status:
          type: "string"
          enum:
            - "ACTIVE"
            - "SIGHTED"
            - "RECOVERED"
            - "CLOSED"
        location:
          $ref: "#/components/schemas/GeoPoint"
        theftTime:
          type: "string"
          format: "date-time"
          
    UserResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        username:
          type: "string"
          example: "test_user"
    BikeResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        brand:
          type: "string"
          example: "Helkama"
        model:
          type: "string"
          example: "XS29.3"
        type:
          type: "string"
          example: "maastopyörä"
        color:
          type: "string"
          example: "sininen"
        serialNumber:
          type: "string"
          nullable: true
          example: "A12B34C56D78E"
        description:
          type: "string"
          example: "punaiset vanteet, jalka rikki"
        user:
          $ref: "#/components/schemas/UserResponse"
    TheftReportResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        description:
          type: "string"
          example: "varastettu pyöräkatoksesta"
        theftTime:
          type: "string"
          format: "date-time"
        theftAddress:
          type: "string"
          nullable: true
          example: "Yliopistokatu 1, 80100 Joensuu"
        location:
          $ref: "#/components/schemas/GeoPoint"
        status:
          type: "string"
          nullable: true
          enum:
            - "ACTIVE"
            - "SIGHTED"
            - "RECOVERED"
            - "CLOSED"
        createdAt:
          type: "string"
          format: "date-time"
        bike:
          $ref: "#/components/schemas/BikeResponse"
    UserInfo:
      type: "object"
      required:
        - username
        - email
      properties:
        username:
          type: "string"
          example: "test_user"
          minLength: 3
          maxLength: 20
        email:
          type: "string"
          example: "test@email.com"
          format: "email"
          minLength: 6
          maxLength: 254
    BikeInfo:
      type: "object"
      required:
        - brand
        - model
        - type
        - color
        - description
        - user
      properties:
        brand:
          type: "string"
          example: "Helkama"
          minLength: 1
          maxLength: 30
        model:
          type: "string"
          example: "XS29.3"
          minLength: 1
          maxLength: 30
        type:
          type: "string"
          example: "maastopyörä"
          minLength: 1
          maxLength: 30
        color:
          type: "string"
          example: "sininen"
          minLength: 1
          maxLength: 30
        serialNumber:
          type: "string"
          nullable: true
          example: "A12B34C56D78E"
          minLength: 1
          maxLength: 30
        description:
          type: "string"
          example: "Punaiset vanteet, jalka rikki"
          minLength: 1
          maxLength: 300
        user:
          $ref: "#/components/schemas/UserInfo"
    CreateTheftReportRequest:
      type: "object"
      required:
        - description
        - theftTime
        - location
        - bike
      properties:
        description:
          type: "string"
          example: "Varastettu pyöräkatoksesta"
          minLength: 1
          maxLength: 300
        theftTime:
          type: "string"
          format: "date-time"
        theftAddress:
          type: "string"
          example: "Yliopistokatu 1, 80100 Joensuu"
          nullable: true
          maxLength: 150
        location:
          $ref: "#/components/schemas/GeoPoint"
        bike:
          $ref: "#/components/schemas/BikeInfo"
    ErrorResponse:
      type: "object"
      properties:
        error:
          type: "string"
          example: "NOT FOUND"
        statusCode:
          type: "integer"
          example: 404
        message:
          type: "string"
          example: "TheftReport was not found with given id"